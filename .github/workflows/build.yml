name: Build Virtual Cigarette Simulator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================================
  # Linux
  # ==========================================================

  linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name VirtualCigaretteSimulator \
            --add-data "models:models" \
            app.py

      - name: Package
        run: |
          cd dist
          tar -czf ../VirtualCigaretteSimulator-linux-x64.tar.gz \
            VirtualCigaretteSimulator

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCigaretteSimulator-linux-x64
          path: VirtualCigaretteSimulator-linux-x64.tar.gz

  # ==========================================================
  # Windows
  # ==========================================================

  windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name VirtualCigaretteSimulator `
            --add-data "models;models" `
            app.py

      - name: Package
        shell: powershell
        run: |
          Compress-Archive `
            -Path dist\VirtualCigaretteSimulator `
            -DestinationPath VirtualCigaretteSimulator-windows-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCigaretteSimulator-windows-x64
          path: VirtualCigaretteSimulator-windows-x64.zip

  # ==========================================================
  # macOS
  # ==========================================================

  macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name VirtualCigaretteSimulator \
            --add-data "models:models" \
            app.py

      - name: Package
        run: |
          cd dist
          zip -r ../VirtualCigaretteSimulator-macos.zip \
            VirtualCigaretteSimulator.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCigaretteSimulator-macos
          path: VirtualCigaretteSimulator-macos.zip
